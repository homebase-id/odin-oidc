# Hydra configuration: the values that do not change per environment. URLs, DSN, the system secret
# and the proxy network come from the environment (docker/.env) and override anything here.
# Development overrides log level and error exposure in compose.dev.yml.
# Reference: https://www.ory.com/docs/hydra/reference/configuration

serve:
  cookies:
    same_site_mode: Lax

oidc:
  subject_identifiers:
    # The subject is the identity's domain, the same for every relying party.
    supported_types:
      - public

oauth2:
  pkce:
    enforced_for_public_clients: true
  expose_internal_errors: false

ttl:
  # How long a login or consent challenge stays valid: the owner's sign-in at their identity
  # happens inside this window.
  login_consent_request: 30m

log:
  level: info
  leak_sensitive_values: false
