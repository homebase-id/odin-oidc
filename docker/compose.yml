# The broker: Ory Hydra with Postgres, and the login app. This file is the production shape and
# publishes no port: put your TLS proxy on the `oidc` network and route as docs/production.md says.
# Development adds compose.dev.yml on top, which docker/.env selects through COMPOSE_FILE.
name: odin-oidc

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  restart: unless-stopped

x-hydra-image: &hydra-image ${HYDRA_IMAGE:-oryd/hydra@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9} # oryd/hydra:v26.2.0
x-hydra-dsn: &hydra-dsn postgres://hydra:${HYDRA_DB_PASSWORD:?set in docker/.env}@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
x-oidc-network: &oidc-network ${OIDC_NETWORK:-172.30.0.0/24}

services:
  postgres:
    <<: *hardened
    image: ${POSTGRES_IMAGE:-postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54} # postgres:16
    # As its own user from the start, so the image's entrypoint never needs root and no capability comes back.
    user: postgres
    environment:
      POSTGRES_DB: hydra
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${HYDRA_DB_PASSWORD}
    volumes:
      - hydra-pgdata:/var/lib/postgresql/data
    tmpfs:
      - /run/postgresql
      - /tmp
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 5s
      retries: 20

  hydra-migrate:
    <<: *hardened
    image: *hydra-image
    command: migrate sql up -e --yes
    environment:
      DSN: *hydra-dsn
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  hydra:
    <<: *hardened
    image: *hydra-image
    command: serve all --config /etc/config/hydra/hydra.yml --sqa-opt-out
    environment:
      DSN: *hydra-dsn
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:?set in docker/.env}
      URLS_SELF_ISSUER: ${HYDRA_ISSUER:?set in docker/.env}
      URLS_LOGIN: ${LOGIN_APP_URL:?set in docker/.env}/login
      URLS_CONSENT: ${LOGIN_APP_URL}/consent
      URLS_LOGOUT: ${LOGIN_APP_URL}/logout
      # Requests arrive over plain http from the proxy on the oidc network, which terminated TLS.
      SERVE_TLS_ALLOW_TERMINATION_FROM: *oidc-network
    volumes:
      - ./hydra:/etc/config/hydra:ro
    mem_limit: 512m
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  login:
    <<: *hardened
    # A tag or digest from the publish workflow (ghcr.io/homebase-id/odin-oidc-login:vX.Y.Z), set in
    # docker/.env; the default is a local build, which a host without one cannot pull. The image declares /keys.
    image: ${LOGIN_IMAGE:-odin-oidc-login}
    environment:
      Broker__PublicOrigin: ${LOGIN_APP_URL}
      Broker__ClientName: ${BROKER_CLIENT_NAME:-Homebase Sign-in}
      Broker__HydraAdminUrl: http://hydra:4445/
      Broker__TrustedProxyNetworks__0: *oidc-network
    volumes:
      - login-keys:/keys
    mem_limit: 256m
    depends_on:
      - hydra

volumes:
  hydra-pgdata:
  login-keys:

networks:
  # The one network, named so a proxy can join it; a fixed subnet, so the two trust settings above are knowable.
  default:
    name: oidc
    ipam:
      config:
        - subnet: *oidc-network
