name: Publish image

# On a version tag: the login image for amd64 and arm64 to GHCR, public, built against the odin-core
# commit in odin-core.ref. The job summary carries the digest to pin in a deployment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned odin-core commit
        id: core
        run: echo "sha=$(cat odin-core.ref)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/odin-oidc-login
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ODIN_CORE_SHA=${{ steps.core.outputs.sha }}
          provenance: true

      - name: Digest to pin
        run: |
          echo "## ghcr.io/${{ github.repository_owner }}/odin-oidc-login@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Built against odin-core ${{ steps.core.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
